<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="title desc">
<title>Suusri AI</title>
<desc>Suusri AI golden lotus logo with circuit detail</desc>
<defs>
  <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFF8DC"/>
    <stop offset="25%" stop-color="#FFD700"/>
    <stop offset="50%" stop-color="#FFB700"/>
    <stop offset="75%" stop-color="#D4A017"/>
    <stop offset="100%" stop-color="#8C6A00"/>
  </linearGradient>
  <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8C6A00"/>
    <stop offset="50%" stop-color="#FFD700"/>
    <stop offset="100%" stop-color="#8C6A00"/>
  </linearGradient>
  <radialGradient id="goldGlow" cx="50%" cy="70%" r="60%">
    <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9"/>
    <stop offset="40%" stop-color="#FFA500" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#8C6A00" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="30%" stop-color="#E8E8F0"/>
    <stop offset="60%" stop-color="#C8C8D8"/>
    <stop offset="100%" stop-color="#9A9AB0"/>
  </linearGradient>
  <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#9D4EDD"/>
    <stop offset="50%" stop-color="#7B2CF0"/>
    <stop offset="100%" stop-color="#4F46E5"/>
  </linearGradient>
  <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFB700" flood-opacity="0.8"/>
  </filter>
  <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#9D4EDD" flood-opacity="0.9"/>
  </filter>
  <filter id="lotusGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFB700" flood-opacity="0.6"/>
  </filter>
</defs>

<!-- Lotus Icon Group -->
<g transform="translate(125,145)" filter="url(#lotusGlow)">
  <!-- outer glow -->
  <ellipse cx="0" cy="25" rx="85" ry="75" fill="url(#goldGlow)" opacity="0.35"/>
  <!-- Petals: 9 petals fan -->
  <!-- Central tall petal -->
  <path d="M 0,-95 C -22,-70 -28,-40 -18,-10 C -10,10 10,10 18,-10 C 28,-40 22,-70 0,-95 Z" fill="#FFFEF7" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Left/right inner petals -->
  <g opacity="1">
    <path d="M -22,-72 C -38,-52 -42,-24 -28,0 C -18,14 -8,12 0,-8 C 4,-28 -6,-55 -22,-72 Z" fill="#FFFEF7" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M 22,-72 C 38,-52 42,-24 28,0 C 18,14 8,12 0,-8 C -4,-28 6,-55 22,-72 Z" fill="#FFFEF7" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M -45,-48 C -60,-30 -62,-4 -42,16 C -30,26 -16,20 -8,2 C -6,-18 -24,-36 -45,-48 Z" fill="#FFFDF5" stroke="url(#goldGrad)" stroke-width="2.8" />
    <path d="M 45,-48 C 60,-30 62,-4 42,16 C 30,26 16,20 8,2 C 6,-18 24,-36 45,-48 Z" fill="#FFFDF5" stroke="url(#goldGrad)" stroke-width="2.8" />
    <path d="M -58,-18 C -72,-2 -70,20 -50,34 C -36,40 -22,32 -16,16 C -16,-6 -36,-14 -58,-18 Z" fill="#FFFDF5" stroke="url(#goldGrad)" stroke-width="2.6" />
    <path d="M 58,-18 C 72,-2 70,20 50,34 C 36,40 22,32 16,16 C 16,-6 36,-14 58,-18 Z" fill="#FFFDF5" stroke="url(#goldGrad)" stroke-width="2.6" />
    <path d="M -52,12 C -68,22 -66,40 -48,48 C -34,52 -22,42 -16,28 C -16,16 -34,10 -52,12 Z" fill="#FFFEF7" stroke="url(#goldGrad)" stroke-width="2.4" />
    <path d="M 52,12 C 68,22 66,40 48,48 C 34,52 22,42 16,28 C 16,16 34,10 52,12 Z" fill="#FFFEF7" stroke="url(#goldGrad)" stroke-width="2.4" />
    <!-- Bottom small petals -->
    <path d="M -28,32 C -36,42 -34,54 -22,60 C -14,62 -6,56 -2,44 C -4,34 -18,28 -28,32 Z" fill="#FFFEF7" stroke="url(#goldGrad)" stroke-width="2.2"/>
    <path d="M 28,32 C 36,42 34,54 22,60 C 14,62 6,56 2,44 C 4,34 18,28 28,32 Z" fill="#FFFEF7" stroke="url(#goldGrad)" stroke-width="2.2"/>
    <path d="M 0,38 C -8,48 -6,60 0,66 C 6,60 8,48 0,38 Z" fill="#FFFEF7" stroke="url(#goldGrad)" stroke-width="2.2"/>
  </g>
  <!-- Circuit lines inside central petal -->
  <g stroke="#D4A017" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M 0,-18 L 0,-62"/>
    <path d="M 0,-52 L -10,-52 L -10,-42"/>
    <path d="M 0,-45 L 10,-45 L 10,-36"/>
    <path d="M -10,-42 L -14,-38"/>
    <path d="M 10,-36 L 14,-32"/>
    <!-- left branch -->
    <path d="M -8,-18 L -8,-38 L -14,-38 L -14,-28"/>
    <path d="M -8,-30 L -4,-30 L -4,-22"/>
    <!-- right branch -->
    <path d="M 8,-18 L 8,-38 L 14,-38 L 14,-28"/>
    <path d="M 8,-30 L 4,-30 L 4,-22"/>
  </g>
  <!-- Circuit nodes -->
  <g fill="url(#goldGrad)" stroke="#8C6A00" stroke-width="0.8">
    <circle cx="0" cy="-62" r="5"/>
    <circle cx="-14" cy="-38" r="3.2"/>
    <circle cx="14" cy="-32" r="3.2"/>
    <circle cx="-14" cy="-28" r="2.6"/>
    <circle cx="14" cy="-28" r="2.6"/>
    <circle cx="-4" cy="-22" r="2.6"/>
    <circle cx="4" cy="-22" r="2.6"/>
    <circle cx="-10" cy="-52" r="2.2"/>
    <circle cx="10" cy="-45" r="2.2"/>
  </g>
  <!-- Central glow point -->
  <circle cx="0" cy="28" r="7" fill="#FFD700" opacity="0.95" filter="url(#glowGold)"/>
  <circle cx="0" cy="28" r="3" fill="#FFFDE7"/>
  <!-- Small outer gold dots with glow around lotus -->
  <g fill="#FFD700" filter="url(#glowGold)" opacity="0.9">
    <circle cx="-68" cy="-38" r="2.2"/><circle cx="-78" cy="-8" r="2.8"/><circle cx="-72" cy="18" r="1.8"/>
    <circle cx="68" cy="-38" r="2.2"/><circle cx="78" cy="-8" r="2.2"/><circle cx="72" cy="18" r="1.8"/>
    <circle cx="-48" cy="-92" r="1.6"/><circle cx="48" cy="-92" r="1.6"/><circle cx="-62" cy="-68" r="1.4"/><circle cx="62" cy="-68" r="1.4"/>
    <circle cx="-38" cy="58" r="1.6"/><circle cx="38" cy="58" r="1.6"/><circle cx="0" cy="72" r="1.4"/>
  </g>
  <!-- Connecting thin lines for outer dots -->
  <g stroke="#FFD700" stroke-width="0.6" opacity="0.5">
    <path d="M -68,-38 L -55,-28"/>
    <path d="M 68,-38 L 55,-28"/>
    <path d="M -48,-92 L -40,-80"/>
    <path d="M 48,-92 L 40,-80"/>
  </g>
</g>

<!-- Text Group -->
<g font-family="Georgia, 'Times New Roman', serif" text-rendering="geometricPrecision">
  <!-- Top ShiroRekha bar - gold with bevel -->
  <g filter="url(#glowGold)">
    <path d="M 295,88 L 902,88 C 914,88 920,92 918,100 L 914,108 L 295,108 C 285,108 278,104 278,95 C 278,86 285,88 295,88 Z" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round" opacity="1"/>
    <path d="M 282,92 C 282,92 278,96 282,102 L 286,108 L 295,108 L 295,88 Z" fill="url(#goldGrad)"/>
    <path d="M 918,100 L 914,108 L 902,108 L 906,100 Z" fill="url(#goldGrad)"/>
    <!-- vertical connectors down to letters -->
    <rect x="373" y="95" width="7" height="46" rx="2" fill="url(#goldGrad)"/>
    <rect x="688" y="95" width="7" height="36" rx="2" fill="url(#goldGrad)"/>
    <rect x="855" y="95" width="7" height="26" rx="2" fill="url(#goldGrad)"/>
  </g>
  <!-- Star at top right of bar -->
  <g transform="translate(885,68)" filter="url(#glowGold)">
    <path d="M 0,-18 L 4,-4 L 18,0 L 4,4 L 0,18 L -4,4 L -18,0 L -4,-4 Z" fill="#FFFEF7" stroke="url(#goldGrad)" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="2" fill="#FFD700"/>
  </g>
  <!-- Suusri text - stylized with gold bevel and silver fill -->
  <g font-size="138" font-weight="700" letter-spacing="-2" filter="url(#glowGold)">
    <!-- S - first letter with elongated tail -->
    <text x="290" y="195" fill="url(#silverGrad)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" style="paint-order: stroke fill; font-style: italic;">S</text>
    <!-- remaining uusri -->
    <text x="375" y="195" fill="url(#silverGrad)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" style="paint-order: stroke fill;">uusri</text>
    <!-- decorative tail under S -->
    <path d="M 295,205 C 310,225 340,235 360,222" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <!-- tail under r -->
    <path d="M 715,205 C 730,225 760,235 780,218" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- Dots above i's -->
  <g filter="url(#glowGold)">
    <!-- first i red gem -->
    <circle cx="800" cy="115" r="13" fill="#0F0F0F" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="800" cy="115" r="9.5" fill="#DC2626" stroke="#FF6B6B" stroke-width="1"/>
    <ellipse cx="797" cy="111" rx="3.5" ry="2.5" fill="#FFAAAA" opacity="0.9"/>
    <circle cx="800" cy="115" r="1.2" fill="#FFFFFF"/>
    <!-- second i white pearl -->
    <circle cx="858" cy="115" r="13" fill="#0F0F0F" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="858" cy="115" r="9.5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <ellipse cx="855" cy="111" rx="3.5" ry="2.5" fill="#FFFFFF" opacity="1"/>
    <circle cx="858" cy="115" r="1.2" fill="#CBD5E1"/>
  </g>

  <!-- AI Section -->
  <g filter="url(#glowPurple)">
    <!-- Left pillar -->
    <g>
      <rect x="938" y="95" width="16" height="125" rx="7" fill="url(#goldGrad)" stroke="#8C6A00" stroke-width="1"/>
      <rect x="940" y="99" width="12" height="117" rx="5" fill="none" stroke="#FFF8DC" stroke-width="0.8" opacity="0.5"/>
      <!-- top gem blue -->
      <circle cx="946" cy="100" r="9" fill="#0F0F0F" stroke="url(#goldGrad)" stroke-width="1.8"/>
      <circle cx="946" cy="100" r="6.5" fill="#3B82F6" stroke="#60A5FA" stroke-width="1"/>
      <ellipse cx="944" cy="97.5" rx="2.2" ry="1.6" fill="#BFDBFE" opacity="0.9"/>
      <!-- bottom gem -->
      <circle cx="946" cy="212" r="9" fill="#0F0F0F" stroke="url(#goldGrad)" stroke-width="1.8"/>
      <circle cx="946" cy="212" r="6.5" fill="#6366F1" stroke="#818CF8" stroke-width="1"/>
      <ellipse cx="944" cy="209.5" rx="2.2" ry="1.6" fill="#C7D2FE" opacity="0.9"/>
      <!-- inner light line -->
      <rect x="943" y="112" width="2" height="88" rx="1" fill="#FFFDE7" opacity="0.7"/>
    </g>
    <!-- AI Letters -->
    <g font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="900" letter-spacing="1">
      <text x="960" y="208" fill="url(#purpleGrad)" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linejoin="round" style="paint-order: stroke fill;" filter="url(#glowPurple)">AI</text>
      <!-- highlight on AI -->
      <text x="960" y="208" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.4" style="font-family: Georgia, serif; font-size:108px; font-weight:900;">AI</text>
    </g>
    <!-- Right pillar -->
    <g>
      <rect x="1088" y="95" width="16" height="125" rx="7" fill="url(#goldGrad)" stroke="#8C6A00" stroke-width="1"/>
      <rect x="1090" y="99" width="12" height="117" rx="5" fill="none" stroke="#FFF8DC" stroke-width="0.8" opacity="0.5"/>
      <circle cx="1096" cy="100" r="9" fill="#0F0F0F" stroke="url(#goldGrad)" stroke-width="1.8"/>
      <circle cx="1096" cy="100" r="6.5" fill="#6366F1" stroke="#818CF8" stroke-width="1"/>
      <ellipse cx="1094" cy="97.5" rx="2.2" ry="1.6" fill="#C7D2FE" opacity="0.9"/>
      <circle cx="1096" cy="212" r="9" fill="#0F0F0F" stroke="url(#goldGrad)" stroke-width="1.8"/>
      <circle cx="1096" cy="212" r="6.5" fill="#6366F1" stroke="#818CF8" stroke-width="1"/>
      <ellipse cx="1094" cy="209.5" rx="2.2" ry="1.6" fill="#C7D2FE" opacity="0.9"/>
      <rect x="1093" y="112" width="2" height="88" rx="1" fill="#FFFDE7" opacity="0.7"/>
    </g>
  </g>
</g>
</svg>
